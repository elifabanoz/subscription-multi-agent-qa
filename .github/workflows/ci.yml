name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      # `doctor` bilinçli olarak CI'da çalışmaz. Codex ve Claude abonelik
      # oturumları yalnız kullanıcının yerel WSL ortamında doğrulanır.
